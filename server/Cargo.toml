[package]
name = "xito-server"
version = "0.1.0"
edition = "2021"
description = "Máy chủ WebSocket cho game Xì Tố 5 lá (Five-Card Stud)"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
